  file: stop-rules.md
  policy_text: a benchmark whose test set leaks is rotated within 30 days
- id: S5-stop-3
  kind: stop_rule
  file: stop-rules.md
  policy_text: any partner audio whose permission is withdrawn is removed within the SLA and the counter
    corrected publicly
- id: S5-gating-2
  kind: gating_exception
  file: gating-exception.md
  policy_text: Every other release is ungated.
- id: S5-claims-1
  kind: claims_rule
  file: claims-rules.md
  policy_text: Count only what is released
- id: S5-claims-2
  kind: claims_rule
  file: claims-rules.md
  policy_text: Name the licence class in the claim
- id: S5-claims-3
  kind: claims_rule
  file: claims-rules.md
  policy_text: Date every claim
- id: S5-claims-4
  kind: claims_rule
  file: claims-rules.md
  policy_text: never pool tiers
- id: S5-claims-5
  kind: claims_rule
  file: claims-rules.md
  policy_text: never compare an open set with a non-commercial or request-only set without saying so
- id: S5-claims-6
  kind: claims_rule
  file: claims-rules.md
  policy_text: '"First" claims require a documented search of Hugging Face, Masader, Kaggle, Zenodo, the
    ACL Anthology and arXiv, saved in the evidence file.'
- id: S5-claims-7
  kind: claims_rule
  file: claims-rules.md
  policy_text: stay in the commercial claims register and are never mixed with open-data counts
