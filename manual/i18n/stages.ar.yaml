  D06: {item: "معرّف DOI", artefacts: "معرّف DOI محجوز في Zenodo"}
  D07: {item: "صفحة الإصدار على الموقع", artefacts: "مسودة صفحة الإصدار مع JSON-LD ورابط عائلة المنتجات المدفوعة"}
  D08: {item: "رسم خط الأساس", artefacts: "رسم بياني لخط الأساس أو المعيار المرجعي (رقم يستطيع الصحفي نشره)"}
  D09: {item: "الإدراجات (Masader وKaggle وGoogle Dataset Search)", artefacts: "مسودات الإدراج (Masader وKaggle)"}
  D10: {item: "إرسال حزمة الإطلاق", artefacts: "مسودات حزمة الإطلاق في `outbox/` (منشور تقني، وفقرة صحفية بالعربية والإنجليزية، وسلسلة منشورات برسم بياني واحد ورقم دقيق واحد، وقائمة الشركاء)"}
  D11: {item: "إنشاء صف المقاييس", artefacts: "قالب صف المقاييس"}
